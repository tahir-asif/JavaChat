server:
  port: ${PORT:8080}

spring:
  cloud:
    gateway:
      httpclient:
        connect-timeout: 120000 # 2 minutes
        response-timeout: 120s
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/api/auth/**, /api/users/**
            - id: chat-service
              uri: ${CHAT_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/api/messages/**, /ws/**
