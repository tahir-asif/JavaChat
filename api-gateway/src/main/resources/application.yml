server:
  port: ${SERVER_PORT:8080}

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/api/auth/**, /api/users/**
            - id: chat-service
              uri: ${CHAT_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/api/messages/**, /ws/**
